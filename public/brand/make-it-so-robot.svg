<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" class="mascot" data-mood="smug" viewBox="0 0 700 850" role="img" aria-label="The Make It So robot assistant: a sleek robot whose screen face shows expressions, wearing an indigo jacket and holding a cup of tea">
                <defs><style>.mood{opacity:0}.m-smug{opacity:1}</style>
                                <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#4de4ff" opacity=".1"/></pattern>
                                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
